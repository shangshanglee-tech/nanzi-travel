limit_req_zone $binary_remote_addr zone=nanzi_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.nanzitravel.com admin.nanzitravel.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nanzitravel.com;

    ssl_certificate /etc/letsencrypt/live/api.nanzitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nanzitravel.com/privkey.pem;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=nanzi_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nanzitravel.com;

    ssl_certificate /etc/letsencrypt/live/api.nanzitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nanzitravel.com/privkey.pem;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ { alias /opt/nanzi-travel/current/backend/staticfiles/; }
    location /media/ { alias /var/lib/nanzi-travel/media/; }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}

