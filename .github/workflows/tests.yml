name: Tests

on:
  pull_request:
  push:
    branches: [release]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mini program tests
        run: node --test miniprogram/tests/*.test.js
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Run backend tests
        working-directory: backend
        run: |
          python manage.py test catalog.tests -v 1
          python manage.py check
      - name: Check deployment scripts
        run: |
          bash deploy/tests/test_deploy_files.sh
          bash deploy/tests/test_github_release_files.sh
