name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: nanzi-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mini program test dependencies
        working-directory: miniprogram
        run: npm ci --ignore-scripts
      - run: node --test miniprogram/tests/*.test.js
      - run: python -m pip install --requirement backend/requirements.lock
      - working-directory: backend
        run: |
          python manage.py test catalog.tests -v 1
          python manage.py check
      - run: |
          bash deploy/tests/test_deploy_files.sh
          bash deploy/tests/test_github_release_files.sh

  deploy-api:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release archive
        run: git archive --format=tar.gz --output="/tmp/nanzi-travel-release-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
      - name: Configure SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload and deploy API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          archive="/tmp/nanzi-travel-release-${GITHUB_SHA}.tar.gz"
          scp "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:$archive"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/nanzi-github-release '$archive' '${GITHUB_SHA}'"
      - name: Verify public API
        run: curl --fail --retry 5 --retry-delay 2 https://api.nanzitravel.com/healthz

  upload-wechat-experience:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install upload dependency
        working-directory: miniprogram
        run: npm ci --ignore-scripts
      - name: Create temporary WeChat private key
        id: wechat_key
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          key_path="$(mktemp)"
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
      - name: Upload WeChat experience build
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY_PATH: ${{ steps.wechat_key.outputs.path }}
        run: node scripts/upload-wechat-experience.cjs
      - name: Remove temporary WeChat private key
        if: always()
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ steps.wechat_key.outputs.path }}
        run: rm -f "$WECHAT_PRIVATE_KEY_PATH"
